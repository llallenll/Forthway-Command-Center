<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="robots" content="noindex, nofollow" />
<meta name="theme-color" content="#050916" />
<title>Set up · Forthway Command Center</title>
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" />
<link rel="stylesheet" href="assets/app.css" />
</head>
<body class="auth-body" data-page="setup">
<main class="auth-shell">
  <section class="auth-art" aria-hidden="true">
    <div class="brand">
      <span class="brand-mark"><img src="assets/forthway-mark.svg" alt="" width="40" height="31" /></span>
      <span class="brand-text"><b data-panel-name>Forthway</b><small>Command Center</small></span>
    </div>
    <h2>Let's get your<br/>panel ready.</h2>
    <p>Websites, load balancing, MySQL and backups — on hardware you own.</p>
    <div class="auth-floats">
      <div class="auth-float"><div class="af-l"><span class="dot ok"></span>Front door</div><div class="af-v">nginx</div></div>
      <div class="auth-float"><div class="af-l"><span class="dot ok"></span>Deploys</div><div class="af-v">Zero-downtime</div></div>
    </div>
  </section>
  <section class="auth-form">
    <h1>Set up your panel</h1>
    <p class="sub">Create the first admin account. You can add more admins later.</p>
    <form id="form" novalidate>
      <div class="field"><label for="name">Your name</label><input class="input" id="name" name="name" autocomplete="name" required autofocus /></div>
      <div class="field"><label for="email">Email</label><input class="input" id="email" name="email" type="email" autocomplete="username" required /></div>
      <div class="field"><label for="password">Password</label>
        <div class="pw-wrap"><input class="input" id="password" name="password" type="password" autocomplete="new-password" minlength="8" required /><button type="button" class="icon-btn" data-toggle-pw aria-label="Show password"></button></div>
        <div class="strength" id="strength"><i></i><i></i><i></i><i></i></div>
        <div class="hint" id="pwHint">At least 8 characters.</div></div>
      <div class="field"><label for="confirm">Confirm password</label>
        <div class="pw-wrap"><input class="input" id="confirm" name="confirm" type="password" autocomplete="new-password" required /><button type="button" class="icon-btn" data-toggle-pw aria-label="Show password"></button></div>
        <div class="hint" id="confirmHint" aria-live="polite"></div></div>
      <div class="field"><label for="panelName">Panel name <span class="dim">(optional)</span></label><input class="input" id="panelName" name="panelName" placeholder="Forthway" autocomplete="off" /></div>
      <div class="error-box" id="err" hidden></div>
      <button class="btn btn-primary btn-lg btn-block" id="go" type="submit">Create admin &amp; continue</button>
    </form>
    <p class="foot" id="foot"></p>
  </section>
</main>
<script type="module">
  // Confirm-password guard. Runs on the document in the capture phase, so a
  // mismatch is stopped before assets/auth.js submits the form.
  const pw = document.getElementById("password"), cf = document.getElementById("confirm");
  const hint = document.getElementById("confirmHint"), err = document.getElementById("err");
  const check = () => {
    const bad = cf.value !== "" && cf.value !== pw.value;
    cf.classList.toggle("invalid", bad);
    hint.textContent = !cf.value ? "" : bad ? "Doesn't match yet." : "Passwords match.";
    hint.style.color = !cf.value ? "" : bad ? "var(--err)" : "var(--ok)";
  };
  pw.addEventListener("input", check);
  cf.addEventListener("input", check);
  document.addEventListener("submit", (e) => {
    if (e.target.id !== "form" || cf.value === pw.value) return;
    e.preventDefault();
    e.stopImmediatePropagation();
    err.hidden = false;
    err.textContent = cf.value ? "The two passwords don't match." : "Type your password again to confirm it.";
    cf.focus();
  }, true);
</script>
<script type="module" src="assets/auth.js"></script>
</body>
</html>
