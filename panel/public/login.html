<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="robots" content="noindex, nofollow" />
<meta name="theme-color" content="#050916" />
<title>Sign in · Forthway Command Center</title>
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" />
<link rel="stylesheet" href="assets/app.css" />
</head>
<body class="auth-body" data-page="login">
<main class="auth-shell">
  <section class="auth-art" aria-hidden="true">
    <div class="brand">
      <span class="brand-mark"><img src="assets/forthway-mark.svg" alt="" width="40" height="31" /></span>
      <span class="brand-text"><b data-panel-name>Forthway</b><small>Command Center</small></span>
    </div>
    <h2>Your servers,<br/>one calm place.</h2>
    <p>Websites, load balancing, MySQL and backups — on hardware you own.</p>
    <div class="auth-floats">
      <div class="auth-float"><div class="af-l"><span class="dot ok"></span>Front door</div><div class="af-v">nginx</div></div>
      <div class="auth-float"><div class="af-l"><span class="dot ok"></span>Deploys</div><div class="af-v">Zero-downtime</div></div>
    </div>
  </section>
  <section class="auth-form">
    <h1>Sign in</h1>
    <p class="sub">Welcome back. Use your admin email and password.</p>
    <form id="form" novalidate>
      <div class="field"><label for="email">Email</label><input class="input" id="email" name="email" type="email" autocomplete="username" required autofocus /></div>
      <div class="field"><label for="password">Password</label>
        <div class="pw-wrap"><input class="input" id="password" name="password" type="password" autocomplete="current-password" required /><button type="button" class="icon-btn" data-toggle-pw aria-label="Show password"></button></div></div>
      <div class="error-box" id="err" hidden></div>
      <button class="btn btn-primary btn-lg btn-block" id="go" type="submit">Sign in</button>
    </form>
    <p class="foot" id="foot">Forgot your password? Another admin can reset it from Settings → Admins.</p>
  </section>
</main>
<script type="module" src="assets/auth.js"></script>
</body>
</html>
