<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="robots" content="noindex, nofollow" />
<meta name="theme-color" content="#060a18" />
<script>
  // The server answers deep links like /projects/prj_x with this page; the app routes on the hash,
  // and relative asset URLs only resolve from "/", so turn the path into a hash route first.
  if (!/^\/(index\.html)?$/.test(location.pathname)) location.replace("/" + location.search + "#" + location.pathname.replace(/\/+$/, ""));
</script>
<title>Forthway Command Center</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230d1220'/%3E%3Cpath d='M11 25V7h11M11 16h8' fill='none' stroke='%23fff' stroke-width='3.4' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" />
<link rel="stylesheet" href="assets/app.css" />
</head>
<body>
<div class="app" id="app">
  <aside class="sidebar" id="sidebar" aria-label="Main navigation">
    <div class="sb-head">
      <a class="brand" href="#/">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 32 32"><path d="M10 26V6h13M10 16h9" fill="none" stroke="#fff" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/></svg>

    </div>
    <nav class="sb-nav" id="sbNav"></nav>
    <div class="sb-foot">
      <nav class="sb-nav" id="sbNavBottom"></nav>
      <div class="sb-status" id="sbStatus"></div>
    </div>
  </aside>
  <div class="sb-overlay" id="sbOverlay"></div>
  <div class="main-wrap">
    <main class="main" id="main">
      <header class="topbar" id="topbar">
        <button class="icon-btn menu-btn" id="menuBtn" aria-label="Open menu"></button>
        <nav class="crumbs" id="crumbs" aria-label="Breadcrumb"></nav>

</div>
<div class="toasts" id="toasts" aria-live="polite"></div>
<div id="modals"></div>
<script type="module" src="assets/app.js"></script>
