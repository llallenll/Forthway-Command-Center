<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23b8892b'/%3E%3Ctext x='16' y='21.5' text-anchor='middle' font-family='Helvetica,Arial,sans-serif' font-size='11' font-weight='700' fill='%23fff'%3EFCC%3C/text%3E%3C/svg%3E" />
<title>Forthway Command Center</title>
<style>
  :root{
    /* Collective OS palette — collectiveos.vercel.app */
    --ground:#F6F3EC; --surface:#FFFFFF; --surface-hi:#F2F0EA; --surface-lo:#FAFAF8;
    --line-bright:#DCDAD3; --paper:#2D2D2F; --fog:#6B7280; --fog-dim:#9CA3AF;
    --night:#141416;
    --ink:var(--paper); --ink-2:#3A3A3C; --ink-3:var(--fog);
    --line:#E9E7E1; --bg:var(--ground); --card:var(--surface);
    --accent:#2D2D2F; --accent-dk:#141416; --accent-bg:rgba(45,45,47,.06);
    --bad:#B91C1C; --bad-bg:#FEF2F2;
    --r-pill:999px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{font:14.5px/1.55 ui-sans-serif,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    color:var(--ink);background:var(--bg);display:grid;place-items:center;padding:24px}
  .box{width:100%;max-width:380px}
  .mark{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;margin:0 auto 16px;
    background:var(--night);color:#fff;border-radius:50%;font-weight:750;font-size:14px;
    letter-spacing:.5px}
  h1{font-size:19px;margin:0 0 4px;text-align:center;font-weight:650}
  p.sub{margin:0 0 22px;text-align:center;color:var(--ink-3);font-size:13px}
  form{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:20px}
  label{display:block;font-size:12px;font-weight:650;color:var(--ink-2);margin-bottom:6px}
  input{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:9px;font-size:14.5px;
    font-family:inherit;background:var(--surface-lo);color:var(--ink)}
  input:focus{outline:none;border-color:var(--accent);background:var(--surface-hi);box-shadow:0 0 0 3px var(--accent-bg)}
  button{width:100%;margin-top:14px;padding:10px;border:0;border-radius:999px;background:var(--night);color:#fff;
    font-size:14.5px;font-weight:600;cursor:pointer;font-family:inherit}
  button:hover{background:#000}
  button:disabled{opacity:.5;cursor:not-allowed}
  .err{background:var(--bad-bg);color:var(--bad);padding:9px 11px;border-radius:8px;font-size:13px;margin-top:12px;display:none}
  .err.show{display:block}
</style>
</head>
<body>
  <div class="box">
    <div class="mark">FCC</div>
    <h1>Forthway Command Center</h1>
    <p class="sub">Sign in to continue</p>
    <form id="f">
      <label for="pw">Password</label>
      <input id="pw" type="password" autocomplete="current-password" autofocus />
      <button id="go" type="submit">Sign in</button>
      <div class="err" id="err"></div>
    </form>
  </div>
<script>
  const f = document.getElementById('f'), pw = document.getElementById('pw');
  const err = document.getElementById('err'), go = document.getElementById('go');
  f.addEventListener('submit', async (e) => {
    e.preventDefault();
    err.classList.remove('show');
    go.disabled = true; go.textContent = 'Signing in...';
    try {
      const res = await fetch('/api/login', {
        method: 'POST', headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ password: pw.value }),
      });
      if (res.ok) { location.href = '/'; return; }
      const j = await res.json().catch(() => ({}));
      err.textContent = j.error || 'Sign in failed.';
      err.classList.add('show');
      pw.select();
    } catch (e2) {
      err.textContent = 'Could not reach the Command Center.';
      err.classList.add('show');
    }
    go.disabled = false; go.textContent = 'Sign in';
  });
</script>
</body>
</html>
